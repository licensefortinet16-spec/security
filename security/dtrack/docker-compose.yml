services:
  trivy:
    image: aquasec/trivy:0.70.0
    container_name: dtrack-trivy
    command:
      - server
      - --listen
      - :8082
      - --token
      - ${TRIVY_API_TOKEN:?TRIVY_API_TOKEN must be set in .env}
    volumes:
      - trivy-cache:/root/.cache/trivy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: dtrack-postgres
    environment:
      POSTGRES_DB: dtrack
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dtrack-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtrack -d dtrack"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dtrack-apiserver:
    image: dependencytrack/apiserver@sha256:1ba4f004e1ec4800ec0e0175b0f1cf361a68f6ac3db9274a32d0a47cd4038f51
    container_name: dtrack-apiserver
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        exec java $${JAVA_OPTIONS} $${EXTRA_JAVA_OPTIONS}
        --add-opens java.base/java.util.concurrent=ALL-UNNAMED
        --sun-misc-unsafe-memory-access=allow
        -Dlogback.configurationFile=$${LOGGING_CONFIG_PATH}
        -DdependencyTrack.logging.level=$${LOGGING_LEVEL}
        -jar $${WAR_FILENAME}
        -context $${CONTEXT}
        -port 8081
    environment:
      ALPINE_DATABASE_MODE: external
      ALPINE_DATABASE_URL: jdbc:postgresql://postgres:5432/dtrack
      ALPINE_DATABASE_DRIVER: org.postgresql.Driver
      ALPINE_DATABASE_USERNAME: dtrack
      ALPINE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      ALPINE_DATABASE_POOL_ENABLED: "true"
      ALPINE_DATABASE_POOL_MAX_SIZE: "10"
      ALPINE_DATABASE_POOL_MIN_IDLE: "2"
      ALPINE_METRICS_ENABLED: "true"
      LOGGING_LEVEL: INFO
      EXTRA_JAVA_OPTIONS: "-Xms512m -Xmx1200m"
    volumes:
      - dtrack-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/version >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 10
    restart: unless-stopped

  dtrack-frontend:
    image: dependencytrack/frontend@sha256:00560b57a6cfdec3c02a6e02be80fce97029241a9c653e8b83c0b670dff1f3ca
    container_name: dtrack-frontend
    depends_on:
      - dtrack-apiserver
    environment:
      API_BASE_URL: http://${PUBLIC_HOST:-200.160.19.14}:8080
    expose:
      - "8080"
    restart: unless-stopped

  dtrack-proxy:
    image: nginx:1.27-alpine
    container_name: dtrack-proxy
    depends_on:
      - dtrack-frontend
      - dtrack-apiserver
    ports:
      - "${PUBLIC_HOST:-200.160.19.14}:8080:8080"
    volumes:
      - ./nginx/dtrack.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  dtrack-data:
  dtrack-postgres:
  trivy-cache:
