[settings]
enabled = true

[[rules]]
id = "critical_vulnerabilities"
severity = "critical"
channel = "grafana"
path = "derived.critical_vulnerabilities"
operator = "gt"
threshold = 0
message = "Existem vulnerabilidades criticas nas imagens analisadas."

[[rules]]
id = "high_vulnerabilities"
severity = "warning"
channel = "grafana"
path = "derived.high_vulnerabilities"
operator = "gte"
threshold = 10
message = "O volume de vulnerabilidades altas atingiu o limite definido."

[[rules]]
id = "risk_score_high"
severity = "warning"
channel = "grafana"
path = "derived.max_risk_score"
operator = "gte"
threshold = 80
message = "O score maximo de risco do portfolio atingiu nivel elevado."

[[rules]]
id = "dtrack_correlation_gap"
severity = "warning"
channel = "grafana"
path = "dtrack_analysis.status"
operator = "eq"
threshold = "correlation_gap"
message = "Dependency-Track ainda nao correlacionou vulnerabilidades para parte dos SBOMs."

[[rules]]
id = "scan_failure"
severity = "critical"
channel = "grafana"
path = "derived.scan_failed"
operator = "gt"
threshold = 0
message = "Uma ou mais etapas do scan terminaram com falha."

[[rules]]
id = "context_scan_gap"
severity = "critical"
channel = "grafana"
path = "derived.unscannable_contexts"
operator = "gt"
threshold = 0
message = "Um ou mais contextos Docker nao puderam ser escaneados."

[[rules]]
id = "dtrack_vulnerable_components"
severity = "warning"
channel = "grafana"
path = "dtrack_analysis.totals.dtrack_vulnerable_components"
operator = "gt"
threshold = 0
message = "O Dependency-Track correlacionou componentes vulneraveis."

[[rules]]
id = "code_secret_detected"
severity = "critical"
channel = "grafana"
path = "derived.code_secrets"
operator = "gt"
threshold = 0
message = "Foram encontrados secrets em diretorios de codigo dos clientes."

[[rules]]
id = "code_high_findings"
severity = "warning"
channel = "grafana"
path = "derived.code_high_findings"
operator = "gt"
threshold = 0
message = "Foram encontrados achados altos no scan de codigo."
